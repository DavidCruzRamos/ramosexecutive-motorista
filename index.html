<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramos Executive | Painel do Motorista</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="IMG-20260726-WA0142.jpg">
  <link rel="shortcut icon" href="IMG-20260726-WA0142.jpg">
  <link rel="apple-touch-icon" href="IMG-20260726-WA0142.jpg">
  <meta name="theme-color" content="#c5a059">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #08090b;
      --bg-surface: #101216;
      --bg-card: #15181e;
      --border: rgba(197, 160, 89, 0.22);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text: #f1f3f7;
      --text-muted: #8b92a0;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.15);
      --waze-blue: #33ccff;
      --maps-red: #ea4335;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px 12px 60px;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Ecrã de Bloqueio */
    #lockOverlay {
      position: fixed;
      inset: 0;
      background: #08090b;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lock-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px 20px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.9);
    }

    .lock-logo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
    }

    .lock-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: var(--gold-light);
      font-weight: 700;
    }

    .lock-input {
      width: 100%;
      background: #0b0c0f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 1.3rem;
      letter-spacing: 6px;
      color: #fff;
      outline: none;
    }

    .header {
      background: linear-gradient(180deg, #161920 0%, #101216 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-top: 2px;
      text-transform: uppercase;
    }

    .badge-privacy {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      background: var(--green-glow);
      color: var(--green);
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background-color: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #0b0c0f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 0.82rem;
      resize: vertical;
      line-height: 1.4;
      outline: none;
    }

    textarea:focus {
      border-color: var(--gold);
    }

    .input-field {
      width: 100%;
      background: #0b0c0f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--gold);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-gold {
      background: linear-gradient(135deg, #c5a059 0%, #e2be77 100%);
      color: #0d0f12;
      box-shadow: 0 4px 14px rgba(197, 160, 89, 0.25);
    }

    .btn-gold:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #1c2027;
      color: var(--text);
      border: 1px solid var(--border-subtle);
    }

    .review-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #0c0e12;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .field-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-item.full {
      grid-column: span 2;
    }

    .field-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .input-price {
      background: #0b0c0f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--green);
      font-size: 1.1rem;
      font-weight: 700;
      width: 100%;
      outline: none;
    }

    .trip-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trip-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
    }

    .nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-waze {
      background: #1a2f3b;
      color: var(--waze-blue);
      border: 1px solid rgba(51, 204, 255, 0.3);
    }

    .btn-maps {
      background: #331f20;
      color: #ff7669;
      border: 1px solid rgba(234, 67, 53, 0.3);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 44px;
      gap: 8px;
    }

    .btn-whatsapp {
      background: #112d22;
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-agenda {
      background: #252219;
      color: var(--gold-light);
      border: 1px solid var(--border);
    }

    .btn-del {
      background: #201315;
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-content {
      background: #15181e;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-option-btn {
      background: #0d0f12;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .nav-option-btn:active {
      border-color: var(--gold);
      background: #1a1e26;
    }

    .nav-option-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-option-address {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- ECRÃ DE BLOQUEIO / SENHA FIXA -->
  <div id="lockOverlay">
    <div class="lock-box">
      <img src="IMG-20260726-WA0142.jpg" class="lock-logo" alt="Logo">
      <div>
        <div class="lock-title">Ramos Executive</div>
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Acesso restrito ao motorista</div>
      </div>
      
      <input type="password" id="pinInput" class="lock-input" placeholder="••••••" maxlength="10" inputmode="numeric" onkeydown="if(event.key==='Enter') verificarAcesso();">
      
      <button type="button" class="btn btn-gold" onclick="verificarAcesso()">Entrar</button>
      <div id="lockError" style="font-size: 0.75rem; color: #ef4444; display: none;">Senha incorreta. Tente novamente.</div>
    </div>
  </div>

  <div class="app-container" id="mainApp">

    <div class="header">
      <div>
        <div class="brand-title">Ramos Executive</div>
        <div class="brand-sub">Painel Operacional do Motorista</div>
      </div>
      <div class="badge-privacy">
        <span class="badge-dot"></span>
        Protegido
      </div>
    </div>

    <!-- ÁREA DE IMPORTAÇÃO -->
    <div class="card" id="importBox">
      <div class="card-title">
        <span>Nova Solicitação</span>
        <button type="button" class="btn btn-secondary" style="width: auto; padding: 4px 10px; font-size: 0.7rem;" onclick="carregarExemplo()">Exemplo</button>
      </div>
      <textarea id="rawMessage" placeholder="Cole aqui a mensagem recebida pelo WhatsApp..."></textarea>
      <button type="button" class="btn btn-gold" onclick="processarTexto()">Processar Mensagem</button>
    </div>

    <!-- FORMULÁRIO DE CONFIRMAÇÃO EDITÁVEL -->
    <div class="card" id="formReview" style="display: none;">
      <div class="card-title">
        <span>Dados Extraídos</span>
        <span style="font-size: 0.68rem; color: var(--text-muted); text-transform: none;">Conferir antes de salvar</span>
      </div>
      <div class="review-grid">
        <div class="field-item">
          <label class="field-label" for="resPassageiro">Passageiro</label>
          <input type="text" id="resPassageiro" class="input-field">
        </div>
        <div class="field-item">
          <label class="field-label" for="resContato">Contato</label>
          <input type="text" id="resContato" class="input-field" placeholder="(31) 9....">
        </div>
        <div class="field-item">
          <label class="field-label" for="resData">Data</label>
          <input type="text" id="resData" class="input-field" placeholder="31/10/2026">
        </div>
        <div class="field-item">
          <label class="field-label" for="resHorario">Horário</label>
          <input type="text" id="resHorario" class="input-field" placeholder="12:30">
        </div>
        <div class="field-item full">
          <label class="field-label" for="resOrigem">Embarque (Origem)</label>
          <input type="text" id="resOrigem" class="input-field">
        </div>

        <div class="field-item full">
          <label class="field-label" for="resParada1">Parada 1 (Opcional)</label>
          <input type="text" id="resParada1" class="input-field" placeholder="Ex: Av. Afonso Pena, 1500">
        </div>
        <div class="field-item full">
          <label class="field-label" for="resParada2">Parada 2 (Opcional)</label>
          <input type="text" id="resParada2" class="input-field" placeholder="Ex: Hotel Fasano">
        </div>
        <div class="field-item full">
          <label class="field-label" for="resParada3">Parada 3 (Opcional)</label>
          <input type="text" id="resParada3" class="input-field" placeholder="Ex: Escritório">
        </div>

        <div class="field-item full">
          <label class="field-label" for="resDestino">Desembarque (Destino Final)</label>
          <input type="text" id="resDestino" class="input-field">
        </div>
        <div class="field-item">
          <label class="field-label" for="resBagagem">Bagagem</label>
          <input type="text" id="resBagagem" class="input-field">
        </div>
        <div class="field-item">
          <label class="field-label" for="resQtd">Passageiros</label>
          <input type="text" id="resQtd" class="input-field">
        </div>
      </div>

      <div class="field-item">
        <label class="field-label" for="inputValor">Valor do Orçamento (R$)</label>
        <input type="text" id="inputValor" class="input-price" value="R$ 180,00" placeholder="R$ 0,00">
      </div>

      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn btn-secondary" onclick="cancelarRevisao()">Cancelar</button>
        <button type="button" class="btn btn-gold" onclick="confirmarAgendamento()">Confirmar Agendamento</button>
      </div>
    </div>

    <!-- LISTA DE AGENDAMENTOS -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
      <span style="font-size: 0.8rem; text-transform: uppercase; color: var(--gold); letter-spacing: 1px; font-weight: 600;">Seus Agendamentos</span>
      <span id="totalTrips" style="font-size: 0.75rem; color: var(--text-muted);">0 agendamento(s)</span>
    </div>

    <div id="tripsList" style="display: flex; flex-direction: column; gap: 14px;"></div>

  </div>

  <!-- MODAL DE NAVEGAÇÃO -->
  <div id="navModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-title">
        <span id="navModalAppTitle">Navegar com Waze</span>
        <span style="cursor: pointer; font-size: 1.1rem; color: var(--text-muted);" onclick="fecharModalNav()">✕</span>
      </div>
      <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: -6px;">Para qual local deseja traçar rota agora?</div>
      
      <div id="navModalOptions" style="display: flex; flex-direction: column; gap: 8px;"></div>

      <button type="button" class="btn btn-secondary" style="margin-top: 6px;" onclick="fecharModalNav()">Fechar</button>
    </div>
  </div>

  <script>
    // Senha fixa e definitiva
    var SENHA_MESTRA = "191215";

    function verificarAcesso() {
      var pinField = document.getElementById('pinInput');
      var val = (pinField ? pinField.value : '').trim();

      if (val === SENHA_MESTRA) {
        var overlay = document.getElementById('lockOverlay');
        if (overlay) {
          overlay.remove(); // Remove o overlay diretamente da página
        }
        try {
          sessionStorage.setItem('ramos_auth', 'true');
        } catch(e) {}
        renderTrips();
      } else {
        var err = document.getElementById('lockError');
        if (err) err.style.display = 'block';
        alert('Senha incorreta.');
        if (pinField) {
          pinField.value = '';
          pinField.focus();
        }
      }
    }

    // Se já autenticou na sessão, remove o ecrã de imediato
    if (sessionStorage.getItem('ramos_auth') === 'true') {
      var ov = document.getElementById('lockOverlay');
      if (ov) ov.remove();
    }

    // Funções Operacionais
    function carregarExemplo() {
      document.getElementById('rawMessage').value = `✦ *SOLICITACAO DE TRANSFER — RAMOS EXECUTIVE* ✦
_Mobilidade com Elegancia_

👤 *Passageiro:* Camila Altamira Ernesto
📱 *Contato:* (31) 97341-7972
📅 *Data:* 31/10/2026
⏰ *Horário:* 12:30

📍 *Origem:* R Geraldo Teixeira da Costa, 1049
🛑 *Parada 1:* Av. Afonso Pena, 1500
🛑 *Parada 2:* Hotel Fasano Belo Horizonte
🏁 *Destino:* Aeroporto Confins
✈️ *Voo:* Não informado
👥 *Passageiros:* 2 Passageiros
🧳 *Bagagem:* 1 a 2 malas grandes

💬 *Observações:* Nenhuma

_Aguardo a confirmação e orçamento._`;
    }

    function processarTexto() {
      var raw = document.getElementById('rawMessage').value;
      if (!raw.trim()) return alert('Por favor, cole a mensagem primeiro.');

      var clean = function(s) { return (s || '').replace(/[*_~`]/g, '').trim(); };
      var lines = raw.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);

      var findValue = function(keywords) {
        for (var i = 0; i < lines.length; i++) {
          for (var k = 0; k < keywords.length; k++) {
            var regex = new RegExp('^[^a-zA-Z0-9]*' + keywords[k] + '\\s*[:：\\-]?\\s*(.*)$', 'i');
            var match = lines[i].match(regex);
            if (match && match[1]) return clean(match[1]);
          }
        }
        return '';
      };

      var passageiro = findValue(['passageiro', 'cliente', 'nome']) || 'Não informado';
      
      var contato = findValue(['contato', 'telefone', 'celular', 'whatsapp', 'fone', 'tel']);
      if (!contato) {
        var phoneMatch = raw.match(/(?:\+?55\s*)?(?:\(?\d{2}\)?\s*)?9?\d{4}[-\s]?\d{4}/);
        contato = phoneMatch ? clean(phoneMatch[0]) : '';
      }

      var data = '';
      var dateMatch = raw.match(/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/);
      if (dateMatch) {
        data = dateMatch[0];
      } else {
        data = findValue(['data', 'dia']);
      }

      var horario = '';
      var timeMatch = raw.match(/\b([01]?\d|2[0-3])[:hH]([0-5]\d)\b/);
      if (timeMatch) {
        horario = (timeMatch[1].length === 1 ? '0' + timeMatch[1] : timeMatch[1]) + ':' + timeMatch[2];
      } else {
        horario = findValue(['hor[aá]rio', 'hora', 'hor']);
      }

      var origem = findValue(['origem', 'embarque', 'partida']);
      var parada1 = findValue(['parada 1', 'parada 01', 'primeira parada', 'parada']);
      var parada2 = findValue(['parada 2', 'parada 02', 'segunda parada']);
      var parada3 = findValue(['parada 3', 'parada 03', 'terceira parada']);
      var destino = findValue(['destino', 'desembarque', 'chegada']);

      var passageiros = findValue(['passageiros', 'qtd passageiros', 'pessoas']) || '1';
      var bagagem = findValue(['bagagem', 'malas']) || 'Não informada';

      origem = origem.replace(/^(origem|embarque)\s*[:：\-]?\s*/i, '');
      destino = destino.replace(/^(destino|desembarque)\s*[:：\-]?\s*/i, '');

      document.getElementById('resPassageiro').value = passageiro;
      document.getElementById('resContato').value = contato;
      document.getElementById('resData').value = data;
      document.getElementById('resHorario').value = horario;
      document.getElement
