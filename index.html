<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramos Executive | Painel do Motorista</title>
  
  <!-- Manifesto e Ícones Oficiais Absolutos -->
  <link rel="manifest" href="/ramosexecutive-motorista/manifest.json">
  <link rel="icon" type="image/jpeg" href="/ramosexecutive-motorista/IMG-20260726-WA0142.jpg">
  <link rel="shortcut icon" href="/ramosexecutive-motorista/IMG-20260726-WA0142.jpg">
  <link rel="apple-touch-icon" href="/ramosexecutive-motorista/IMG-20260726-WA0142.jpg">
  <meta name="theme-color" content="#c5a059">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #08090b;
      --bg-surface: #101216;
      --bg-card: #15181e;
      --border: rgba(197, 160, 89, 0.22);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text: #f1f3f7;
      --text-muted: #8b92a0;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.15);
      --waze-blue: #33ccff;
      --maps-red: #ea4335;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px 12px 60px;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      background: linear-gradient(180deg, #161920 0%, #101216 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-top: 2px;
      text-transform: uppercase;
    }

    .badge-privacy {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      background: var(--green-glow);
      color: var(--green);
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background-color: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #0b0c0f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 0.82rem;
      resize: vertical;
      line-height: 1.4;
      outline: none;
    }

    textarea:focus {
      border-color: var(--gold);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-gold {
      background: linear-gradient(135deg, #c5a059 0%, #e2be77 100%);
      color: #0d0f12;
      box-shadow: 0 4px 14px rgba(197, 160, 89, 0.25);
    }

    .btn-gold:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #1c2027;
      color: var(--text);
      border: 1px solid var(--border-subtle);
    }

    .review-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #0c0e12;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .field-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field-item.full {
      grid-column: span 2;
    }

    .field-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .field-value {
      font-size: 0.84rem;
      color: #fff;
      font-weight: 500;
      word-break: break-word;
    }

    .input-price {
      background: #0b0c0f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--green);
      font-size: 1.1rem;
      font-weight: 700;
      width: 100%;
      outline: none;
    }

    .trip-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trip-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
    }

    .nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-waze {
      background: #1a2f3b;
      color: var(--waze-blue);
      border: 1px solid rgba(51, 204, 255, 0.3);
    }

    .btn-maps {
      background: #331f20;
      color: #ff7669;
      border: 1px solid rgba(234, 67, 53, 0.3);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 44px;
      gap: 8px;
    }

    .btn-whatsapp {
      background: #112d22;
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-agenda {
      background: #252219;
      color: var(--gold-light);
      border: 1px solid var(--border);
    }

    .btn-del {
      background: #201315;
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="header">
      <div>
        <div class="brand-title">Ramos Executive</div>
        <div class="brand-sub">Painel Operacional do Motorista</div>
      </div>
      <div class="badge-privacy">
        <span class="badge-dot"></span>
        100% Local
      </div>
    </div>

    <!-- ÁREA DE IMPORTAÇÃO -->
    <div class="card" id="importBox">
      <div class="card-title">
        <span>Nova Solicitação</span>
        <button class="btn btn-secondary" style="width: auto; padding: 4px 10px; font-size: 0.7rem;" onclick="carregarExemplo()">Exemplo</button>
      </div>
      <textarea id="rawMessage" placeholder="Cole aqui a mensagem recebida pelo WhatsApp..."></textarea>
      <button class="btn btn-gold" onclick="processarTexto()">Processar Mensagem</button>
    </div>

    <!-- FORMULÁRIO DE CONFIRMAÇÃO -->
    <div class="card" id="formReview" style="display: none;">
      <div class="card-title">Dados Extraídos</div>
      <div class="review-grid">
        <div class="field-item">
          <span class="field-label">Passageiro</span>
          <span class="field-value" id="resPassageiro">-</span>
        </div>
        <div class="field-item">
          <span class="field-label">Contato</span>
          <span class="field-value" id="resContato">-</span>
        </div>
        <div class="field-item">
          <span class="field-label">Data</span>
          <span class="field-value" id="resData">-</span>
        </div>
        <div class="field-item">
          <span class="field-label">Horário</span>
          <span class="field-value" id="resHorario">-</span>
        </div>
        <div class="field-item full">
          <span class="field-label">Embarque (Origem)</span>
          <span class="field-value" id="resOrigem">-</span>
        </div>
        <div class="field-item full">
          <span class="field-label">Desembarque (Destino)</span>
          <span class="field-value" id="resDestino">-</span>
        </div>
        <div class="field-item">
          <span class="field-label">Bagagem</span>
          <span class="field-value" id="resBagagem">-</span>
        </div>
        <div class="field-item">
          <span class="field-label">Passageiros</span>
          <span class="field-value" id="resQtd">-</span>
        </div>
      </div>

      <div class="field-item">
        <span class="field-label">Valor do Orçamento (R$)</span>
        <input type="text" id="inputValor" class="input-price" value="R$ 180,00" placeholder="R$ 0,00">
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="cancelarRevisao()">Cancelar</button>
        <button class="btn btn-gold" onclick="confirmarAgendamento()">Confirmar Agendamento</button>
      </div>
    </div>

    <!-- LISTA DE AGENDAMENTOS -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
      <span style="font-size: 0.8rem; text-transform: uppercase; color: var(--gold); letter-spacing: 1px; font-weight: 600;">Seus Agendamentos</span>
      <span id="totalTrips" style="font-size: 0.75rem; color: var(--text-muted);">0 viagens</span>
    </div>

    <div id="tripsList" style="display: flex; flex-direction: column; gap: 14px;"></div>

  </div>

  <script>
    let tempTrip = null;

    function carregarExemplo() {
      document.getElementById('rawMessage').value = `✦ *SOLICITACAO DE TRANSFER — RAMOS EXECUTIVE* ✦
_Mobilidade com Elegancia_

👤 *Passageiro:* Tatiane
📱 *Contato:* (31) 98115-7372
📅 *Data:* 30/10/2026
⏰ *Horario:* 07:39

📍 *Origem:* Rua Portugal, 625 Nascoes unidas
🏁 *Destino:* Messias Floriano Borges 60
✈️ *Voo:* Nao informado
👥 *Passageiros:* 1 Passageiro
🧳 *Bagagem:* 1 a 2 malas grandes

💬 *Observacoes:* Nenhuma

_Aguardo a confirmacao e orcamento._`;
    }

    function processarTexto() {
      const txt = document.getElementById('rawMessage').value;
      if (!txt.trim()) return alert('Por favor, cole a mensagem primeiro.');

      const get = (re) => (txt.match(re) || [])[1]?.trim() || '';

      tempTrip = {
        id: Date.now(),
        passageiro: get(/👤\s*\*?Passageiro:\*?\s*([^\n\r]+)/i) || 'Não informado',
        contato: get(/📱\s*\*?Contato:\*?\s*([^\n\r]+)/i) || '',
        data: get(/📅\s*\*?Data:\*?\s*([^\n\r]+)/i) || '',
        horario: get(/⏰\s*\*?Horario:\*?\s*([^\n\r]+)/i) || '',
        origem: get(/📍\s*\*?Origem:\*?\s*([^\n\r]+)/i) || '',
        destino: get(/🏁\s*\*?Destino:\*?\s*([^\n\r]+)/i) || '',
        voo: get(/✈️\s*\*?Voo:\*?\s*([^\n\r]+)/i) || 'Não informado',
        passageiros: get(/👥\s*\*?Passageiros:\*?\s*([^\n\r]+)/i) || '1',
        bagagem: get(/🧳\s*\*?Bagagem:\*?\s*([^\n\r]+)/i) || 'Não informada'
      };

      document.getElementById('resPassageiro').innerText = tempTrip.passageiro;
      document.getElementById('resContato').innerText = tempTrip.contato;
      document.getElementById('resData').innerText = tempTrip.data;
      document.getElementById('resHorario').innerText = tempTrip.horario;
      document.getElementById('resOrigem').innerText = tempTrip.origem;
      document.getElementById('resDestino').innerText = tempTrip.destino;
      document.getElementById('resBagagem').innerText = tempTrip.bagagem;
      document.getElementById('resQtd').innerText = tempTrip.passageiros;

      document.getElementById('importBox').style.display = 'none';
      document.getElementById('formReview').style.display = 'flex';
    }

    function cancelarRevisao() {
      tempTrip = null;
      document.getElementById('formReview').style.display = 'none';
      document.getElementById('importBox').style.display = 'flex';
    }

    function confirmarAgendamento() {
      if (!tempTrip) return;
      tempTrip.valor = document.getElementById('inputValor').value || 'A combinar';

      const trips = JSON.parse(localStorage.getItem('ramos_trips') || '[]');
      trips.unshift(tempTrip);
      localStorage.setItem('ramos_trips', JSON.stringify(trips));

      document.getElementById('rawMessage').value = '';
      cancelarRevisao();
      renderTrips();
    }

    function renderTrips() {
      const trips = JSON.parse(localStorage.getItem('ramos_trips') || '[]');
      const container = document.getElementById('tripsList');
      document.getElementById('totalTrips').innerText = `${trips.length} agendamento(s)`;

      if (trips.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 24px;">Nenhum agendamento registado ainda.</div>`;
        return;
      }

      container.innerHTML = trips.map(t => {
        const telLimpo = t.contato.replace(/\D/g, '');
        const msgWhats = encodeURIComponent(`Olá ${t.passageiro}, tudo bem? Seu agendamento de transfer para o dia ${t.data} às ${t.horario} foi confirmado pela Ramos Executive. Valor orçado: ${t.valor}. Estamos à disposição!`);
        const wazeUrl = `https://waze.com/ul?q=${encodeURIComponent(t.origem)}&navigate=yes`;
        const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(t.origem)}`;
        
        return `
          <div class="trip-card">
            <div class="trip-header">
              <div>
                <strong style="color: #fff; font-size: 1rem;">${t.passageiro}</strong>
                <div style="color: var(--text-muted); font-size: 0.78rem;">${t.contato}</div>
              </div>
              <div style="text-align: right;">
                <span style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">Orçamento</span>
                <div style="color: var(--green); font-weight: 700; font-size: 1rem;">${t.valor}</div>
              </div>
            </div>

            <div style="display: flex; gap: 16px; font-size: 0.82rem; background: #0c0e12; padding: 8px 12px; border-radius: 8px;">
              <div>📅 <strong>${t.data}</strong></div>
              <div>⏰ <strong>${t.horario}</strong></div>
            </div>

            <div style="font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px;">
              <div>🟢 <span style="color: var(--text-muted);">Origem:</span> ${t.origem}</div>
              <div>🔴 <span style="color: var(--text-muted);">Destino:</span> ${t.destino}</div>
            </div>

            <div class="nav-buttons">
              <a href="${wazeUrl}" target="_blank" class="btn btn-waze">🚗 Abrir Waze</a>
              <a href="${mapsUrl}" target="_blank" class="btn btn-maps">📍 Abrir Maps</a>
            </div>

            <div class="action-row">
              <a href="https://wa.me/55${telLimpo}?text=${msgWhats}" target="_blank" class="btn btn-whatsapp">WhatsApp</a>
              <button class="btn btn-agenda" onclick="criarEventoAgenda('${t.passageiro}', '${t.origem}', '${t.data}', '${t.horario}', '${t.destino}')">Agenda</button>
              <button class="btn btn-del" onclick="removerViagem(${t.id})">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function removerViagem(id) {
      if (!confirm('Deseja remover este agendamento?')) return;
      let trips = JSON.parse(localStorage.getItem('ramos_trips') || '[]');
      trips = trips.filter(t => t.id !== id);
      localStorage.setItem('ramos_trips', JSON.stringify(trips));
      renderTrips();
    }

    function criarEventoAgenda(passageiro, origem, data, horario, destino) {
      const [dia, mes, ano] = data.split('/');
      const [h, m] = horario.split(':');
      if (!ano || !mes || !dia || !h || !m) return alert('Data ou horário inválidos.');

      const dataObj = new Date(ano, mes - 1, dia, h, m);
      const dataFim = new Date(dataObj.getTime() + 60 * 60 * 1000);

      const fDate = (d) => d.toISOString().replace(/-|:|\.\d\d\d/g, "");
      const calUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Transfer: ' + passageiro)}&dates=${fDate(dataObj)}/${fDate(dataFim)}&details=${encodeURIComponent('Destino: ' + destino)}&location=${encodeURIComponent(origem)}`;
      window.open(calUrl, '_blank');
    }

    renderTrips();
  </script>
</body>
</html>
